<script>

// ===== WebSocket =====
let socket = new WebSocket("wss://あなたのサーバーURL");

// ===== 状態 =====
let currentSpeaker = null;
let myId = null;

// ===== 接続 =====
socket.onopen = () => log("WS接続OK");

socket.onerror = () => log("WSエラー");

socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    log("WS: " + data.type);

    // 自分のID
    if (data.type === "yourId") {
        myId = data.id;
        document.getElementById("myId").textContent = myId;
    }

    // 話者更新
    if (data.type === "speaker") {
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker ? currentSpeaker : "なし";
    }

    // 👇 ここに追加
    if(data.type === "busy"){
        log("他の人が話しています");

    // キュー（任意）
    
    }
};

// ===== マイク =====
navigator.mediaDevices.getUserMedia({ audio: true })
.then(stream => {
    localStream = stream;
    stream.getAudioTracks()[0].enabled = false;
    log("マイクOK");
})
.catch(() => log("マイクNG"));

// ===== 発言制御 =====
setInterval(() => {

    if (localStream) {
        localStream.getAudioTracks()[0].enabled =
            (currentSpeaker === myId);
    }

}, 100);

// ===== ボタン（PC + スマホ対応） =====
let talk = document.getElementById("talk");

function requestTalk() {
    if (socket.readyState !== 1) return;

    socket.send(JSON.stringify({
        type: "requestTalk"
    }));
}

function stopTalk() {
    if (socket.readyState !== 1) return;

    socket.send(JSON.stringify({
        type: "stopTalk"
    }));
}

// スマホ
talk.addEventListener("touchstart", e => {
    e.preventDefault();
    requestTalk();
});

talk.addEventListener("touchend", e => {
    e.preventDefault();
    stopTalk();
});

// PC
talk.addEventListener("mousedown", requestTalk);
talk.addEventListener("mouseup", stopTalk);

</script>
