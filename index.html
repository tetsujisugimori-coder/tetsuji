<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { font-family:sans-serif; }
button { font-size:20px; padding:20px; margin-right:10px; }
#log {
  background:#000;
  color:#0f0;
  font-size:12px;
  height:200px;
  overflow:auto;
  padding:5px;
}
</style>
</head>

<body>

<h2>インカム（最終完成版）</h2>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>
<button id="lockTalk">🔒 固定OFF</button>

<div id="log"></div>

<script>

// ===== ログ =====
function log(msg){
    console.log(msg);
    const el = document.getElementById("log");
    el.innerHTML += msg + "<br>";
    el.scrollTop = el.scrollHeight;
}

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let connectedPeers = {};
let audioMap = {};
let talkLocked = false;
let latestUserList = [];
let peerReady = false;
let initialized = false;
let userInteracted = false;

// ===== マイク制御 =====
function setMicEnabled(enabled){
    if(localStream){
        localStream.getAudioTracks().forEach(track=>{
            track.enabled = enabled;
        });
    }
}

// ===== 他人音ミュート =====
function updateAudioMute(){
    Object.values(audioMap).forEach(audio=>{
        audio.muted = (currentSpeaker === myId);
    });
}

// ===== 音声認識 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recognitionRunning = false;

if(SpeechRecognition){
    recognition = new SpeechRecognition();
    recognition.lang = "ja-JP";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
        const text = event.results[event.results.length - 1][0].transcript;

        log(`[${new Date().toLocaleTimeString()}] 自分: ${text}`);

        socket.send(JSON.stringify({
            type: "transcript",
            text,
            id: myId
        }));
    };

    recognition.onend = () => {
        recognitionRunning = false;

        if((currentSpeaker === myId || talkLocked) && userInteracted){
            recognition.start();
            recognitionRunning = true;
        }
    };
}

// ===== 初期化 =====
async function init(){

    if(initialized) return;
    if(!userInteracted) return;

    initialized = true;

    localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1,
            sampleRate: 16000
        }
    });

    setMicEnabled(false);
}

// ===== Peer =====
function createPeer(){

    peer = new Peer(myId);

    peer.on("open", () => {
        peerReady = true;
        setTimeout(()=>connectUsers(latestUserList), 1000);
    });

    peer.on("call", call => {
        call.answer(localStream);
        attachCallEvents(call);
    });
}

// ===== 通話 =====
function attachCallEvents(call){

    call.on("stream", stream => {

        if(call.peer === myId) return;

        let audio = new Audio();
        audio.srcObject = stream;
        audio.autoplay = true;
        audio.setAttribute("playsinline", true);
        audio.volume = 0.5;

        audio.play().catch(()=>{});

        audioMap[call.peer] = audio;
    });

    call.on("close", ()=>{
        delete audioMap[call.peer];
    });
}

// ===== 接続 =====
function connectUsers(users){

    if(!peerReady) return;

    users.forEach(id => {

        if(id !== myId && !connectedPeers[id]){

            let call = peer.call(id, localStream);
            attachCallEvents(call);
            connectedPeers[id] = true;
        }
    });
}

// ===== 再接続 =====
setInterval(()=>{
    if(peerReady) connectUsers(latestUserList);
},2000);

// ===== WebSocket =====
socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;
        createPeer();
    }

    if(data.type === "userList"){
        latestUserList = data.users;
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker ? currentSpeaker : "なし";

        updateAudioMute();
    }

    if(data.type === "transcript"){
        log(`[${new Date().toLocaleTimeString()}] ${data.id}: ${data.text}`);
    }

    if(data.type === "busy"){
        log("他の人が話しています");
    }
};

// ===== マイク＋認識制御 =====
setInterval(() => {

    const shouldTalk = (currentSpeaker === myId || talkLocked);

    setMicEnabled(shouldTalk);

    if(recognition && userInteracted){

        if(shouldTalk && !recognitionRunning){
            recognition.start();
            recognitionRunning = true;
        }

        if(!shouldTalk && recognitionRunning){
            recognition.stop();
            recognitionRunning = false;
        }
    }

}, 200);

// ===== ボタン =====
document.getElementById("talk").onpointerdown = async ()=>{
    userInteracted = true;
    await init();
    socket.send(JSON.stringify({ type:"requestTalk" }));
};

document.getElementById("talk").onpointerup = ()=>{
    socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
};

// ===== 固定 =====
document.getElementById("lockTalk").onclick = async ()=>{

    userInteracted = true;
    await init();

    talkLocked = !talkLocked;

    if(talkLocked){
        socket.send(JSON.stringify({ type:"requestTalk" }));
    }else{
        socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
    }
};

</script>
</body>
</html>
