<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { user-select:none; }
button {
  font-size:20px;
  padding:20px;
  margin-right:10px;
}
#log {
  background:#000;
  color:#0f0;
  font-size:12px;
  height:200px;
  overflow:auto;
}
</style>
</head>

<body>

<h2>インカム（安定版）</h2>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>
<button id="lockTalk">🔒 固定OFF</button>

<div id="log"></div>

<script>

// ===== ログ =====
function log(msg){
    console.log(msg);
    document.getElementById("log").innerHTML += msg + "<br>";
}

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let audioMap = {};
let talkLocked = false;

// ===== 初期化 =====
async function init(){

    if(localStream) return;

    localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false,

            // Chromium系
            googEchoCancellation: true,
            googNoiseSuppression: true,
            googHighpassFilter: true,

            // Edge強化
            voiceIsolation: true,
            suppressLocalAudioPlayback: true,

            sampleRate: 48000,
            channelCount: 1
        }
    });

    // 初期はOFF
    localStream.getAudioTracks()[0].enabled = false;

    setupNoiseGate(localStream);

    log("マイク準備OK");
}

// ===== ノイズゲート =====
function setupNoiseGate(stream){

    const ctx = new AudioContext();
    const analyser = ctx.createAnalyser();
    const src = ctx.createMediaStreamSource(stream);

    src.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);

    setInterval(()=>{

        analyser.getByteFrequencyData(data);
        let volume = data.reduce((a,b)=>a+b)/data.length;

        const speaking = volume > 45;

        if(localStream){
            const track = localStream.getAudioTracks()[0];

            track.enabled =
                speaking &&
                (currentSpeaker === myId || talkLocked);
        }

    }, 80);
}

// ===== Peer =====
function createPeer(){

    peer = new Peer(myId);

    peer.on("open", id => {
        log("Peer接続: " + id);
    });

    peer.on("call", call => {
        call.answer(localStream);
        attachCall(call);
    });
}

// ===== 通話 =====
function attachCall(call){

    call.on("stream", stream => {

        if(call.peer === myId) return;

        let audio = new Audio();
        audio.srcObject = stream;
        audio.autoplay = true;
        audio.volume = 0.3; // ★重要

        audioMap[call.peer] = audio;

        updateAudioState();
    });
}

// ===== 再生制御 =====
function updateAudioState(){

    Object.keys(audioMap).forEach(id => {

        const audio = audioMap[id];
        if(!audio) return;

        if(id === currentSpeaker){
            audio.muted = false;
            audio.volume = 0.3;
        }else{
            audio.muted = true;
        }
    });
}

// ===== マイク制御 =====
function updateMicState(){

    if(!localStream) return;

    const track = localStream.getAudioTracks()[0];

    if(currentSpeaker === myId || talkLocked){
        track.enabled = true;
    }else{
        track.enabled = false;
    }
}

// ===== WebSocket =====
socket.onmessage = async msg => {

    let data = JSON.parse(msg.data);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;

        await init();
        createPeer();
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker || "なし";

        updateMicState();
        updateAudioState();
    }
};

// ===== ボタン =====
document.getElementById("talk").onpointerdown = () => {
    socket.send(JSON.stringify({ type:"requestTalk" }));
};

document.getElementById("talk").onpointerup = () => {
    socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
};

// ===== 固定 =====
document.getElementById("lockTalk").onclick = () => {

    talkLocked = !talkLocked;

    if(talkLocked){
        socket.send(JSON.stringify({ type:"requestTalk" }));
    }else{
        socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
    }

    updateMicState();
};

</script>

</body>
</html>
