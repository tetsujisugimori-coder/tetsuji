<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { user-select:none; }
button { font-size:20px; padding:20px; }
#log {
  background:#000;
  color:#0f0;
  font-size:12px;
  height:150px;
  overflow:auto;
}
</style>
</head>

<body>

<h2>業務用インカム</h2>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>

<!-- 🎤 マイク確認メーター -->
<canvas id="meter" width="300" height="50" style="border:1px solid #333;"></canvas>

<div id="log"></div>

<script>

// ===== ログ =====
function log(msg){
    console.log(msg);
    document.getElementById("log").innerHTML += msg + "<br>";
}

// ===== マイクメーター =====
function startMicMonitor(stream){

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();

    const mic = audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);

    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("meter");
    const ctx = canvas.getContext("2d");

    function draw(){
        requestAnimationFrame(draw);

        analyser.getByteFrequencyData(dataArray);

        let volume = dataArray.reduce((a,b)=>a+b) / dataArray.length;

        ctx.clearRect(0,0,300,50);

        ctx.fillStyle = volume > 50 ? "red" : "lime";
        ctx.fillRect(0,0,volume*2,50);
    }

    draw();
}

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let connectedPeers = {};
let userInteracted = false;

// ===== Safari対策（クリック後初期化） =====
document.body.addEventListener("click", async () => {

    if(userInteracted) return;
    userInteracted = true;

    log("初期化開始");

    // ===== マイク =====
    try{
        localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
        localStream.getAudioTracks()[0].enabled = false;

        // 🎤 メーター開始
        startMicMonitor(localStream);

        log("マイクOK");
    }catch{
        log("マイクNG");
    }

    // ===== Peer =====
    peer = new Peer({
        config: {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        }
    });

    peer.on("open", id => {
        log("PeerID: " + id);

        socket.send(JSON.stringify({
            type:"join",
            id
        }));
    });

    // ===== 着信 =====
    peer.on("call", call => {

        call.answer(localStream);

        call.on("stream", stream => {

            log("音声受信");

            let audio = new Audio();
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.setAttribute("playsinline", true);

            audio.play().catch(()=>{});
        });
    });

});

// ===== WebSocket =====
socket.onopen = () => log("WS接続OK");

socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    log("WS: " + data.type);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;
    }

    if(data.type === "userList"){

        data.users.forEach(id => {

            if(peer && id !== peer.id && !connectedPeers[id]){

                log("接続: " + id);

                let call = peer.call(id, localStream);

                call.on("stream", stream => {

                    log("音声受信（発信側）");

                    let audio = new Audio();
                    audio.srcObject = stream;
                    audio.autoplay = true;
                    audio.setAttribute("playsinline", true);

                    audio.play().catch(()=>{});
                });

                connectedPeers[id] = true;
            }
        });
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker ? currentSpeaker : "なし";
    }

    if(data.type === "busy"){
        log("他の人が話しています");
    }
};

// ===== 発言制御 =====
setInterval(() => {
    if(localStream){
        localStream.getAudioTracks()[0].enabled =
            (currentSpeaker === myId);
    }
}, 100);

// ===== ボタン =====
let talk = document.getElementById("talk");

function requestTalk(){
    socket.send(JSON.stringify({ type:"requestTalk" }));
}

function stopTalk(){
    socket.send(JSON.stringify({ type:"stopTalk" }));
}

// スマホ
talk.addEventListener("touchstart", e=>{
    e.preventDefault();
    requestTalk();
});
talk.addEventListener("touchend", e=>{
    e.preventDefault();
    stopTalk();
});

// PC
talk.addEventListener("mousedown", requestTalk);
talk.addEventListener("mouseup", stopTalk);

</script>

</body>
</html>
