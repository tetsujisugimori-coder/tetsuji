<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { user-select:none; -webkit-user-select:none; }
button {
  font-size:20px;
  padding:20px;
  margin-right:10px;
  touch-action:manipulation;
}
#log {
  background:#000;
  color:#0f0;
  font-size:12px;
  height:200px;
  overflow:auto;
}
</style>
</head>

<body>

<h2>インカム（最終版）</h2>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>
<button id="lockTalk">🔒 固定OFF</button>

<canvas id="meter" width="300" height="50" style="border:1px solid #333;"></canvas>

<div id="log"></div>

<script>

// ===== ログ =====
function log(msg){
    console.log(msg);
    document.getElementById("log").innerHTML += msg + "<br>";
}

// ===== マイクメーター =====
function startMicMonitor(stream){
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();
    const mic = audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);

    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("meter");
    const ctx = canvas.getContext("2d");

    function draw(){
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        let volume = dataArray.reduce((a,b)=>a+b) / dataArray.length;

        ctx.clearRect(0,0,300,50);
        ctx.fillStyle = volume > 50 ? "red" : "lime";
        ctx.fillRect(0,0,volume*2,50);
    }
    draw();
}

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let connectedPeers = {};
let peerReady = false;
let initialized = false;

let audioElement;
let latestUserList = [];

// ===== 初期化 =====
async function init(){

    if(initialized) return;
    initialized = true;

    log("初期化開始");

    try{
        localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
        localStream.getAudioTracks()[0].enabled = true; // デバッグ中は常時ON

        startMicMonitor(localStream);

        log("マイクOK");
    }catch(e){
        log("マイクNG: " + e.message);
    }

    audioElement = new Audio();
    audioElement.setAttribute("playsinline", true);
    audioElement.autoplay = true;
}

// ===== Peer作成 =====
function createPeer(){

    peer = new Peer(myId);

    peer.on("open", id => {
        log("PeerID: " + id);

        peerReady = true;

        // ★ 少し待ってから接続
        setTimeout(()=>{
            connectUsers(latestUserList);
        }, 1000);
    });

    peer.on("error", err => {
        log("Peerエラー: " + err);
    });

    peer.on("call", call => {

        log("着信あり");

        call.answer(localStream);

        attachCallEvents(call);
    });
}

// ===== Callイベント =====
function attachCallEvents(call){

    call.on("stream", stream => {
        log("音声受信");

        audioElement.srcObject = stream;
        audioElement.play().catch(e=>{
            log("再生失敗: " + e.message);
        });
    });

    call.on("close", () => log("通話終了"));
    call.on("error", err => log("通話エラー: " + err));

    call.peerConnection?.addEventListener("iceconnectionstatechange", () => {
        log("ICE状態: " + call.peerConnection.iceConnectionState);
    });
}

// ===== 接続 =====
function connectUsers(users){

    if(!peerReady){
        log("Peer未準備スキップ");
        return;
    }

    users.forEach(id => {

        if(id !== myId && !connectedPeers[id]){

            log("発信開始: " + id);

            let call = peer.call(id, localStream);

            attachCallEvents(call);

            connectedPeers[id] = true;
        }
    });
}

// ===== 再接続ループ（重要）=====
setInterval(()=>{
    if(peerReady && latestUserList.length > 0){
        connectUsers(latestUserList);
    }
}, 3000);

// ===== WebSocket =====
socket.onopen = () => log("WS接続OK");

socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    log("WS: " + data.type);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;

        createPeer();
    }

    if(data.type === "userList"){
        latestUserList = data.users;
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker ? currentSpeaker : "なし";
    }

    if(data.type === "busy"){
        log("他の人が話しています");
    }
};

// ===== ボタン =====
let talk = document.getElementById("talk");

talk.addEventListener("pointerdown", async (e)=>{
    e.preventDefault();

    if(!initialized) await init();

    audioElement.play().catch(()=>{});

    socket.send(JSON.stringify({ type:"requestTalk" }));
});

talk.addEventListener("pointerup", (e)=>{
    e.preventDefault();

    socket.send(JSON.stringify({
        type:"stopTalk",
        id: myId
    }));
});

// ===== 固定 =====
let lockBtn = document.getElementById("lockTalk");
let locked = false;

lockBtn.addEventListener("click", async ()=>{

    if(!initialized) await init();

    locked = !locked;

    if(locked){
        lockBtn.textContent = "🔓 固定ON";
        socket.send(JSON.stringify({ type:"requestTalk" }));
    }else{
        lockBtn.textContent = "🔒 固定OFF";
        socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
    }
});

</script>

</body>
</html>
