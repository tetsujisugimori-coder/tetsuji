<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body {
  user-select:none;
  -webkit-user-select:none;
}

button {
  font-size:20px;
  padding:20px;
  margin-right:10px;

  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}

#log {
  background:#000;
  color:#0f0;
  font-size:12px;
  height:150px;
  overflow:auto;
}
</style>
</head>

<body>

<h2>業務用インカム</h2>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>
<button id="lockTalk">🔒 固定OFF</button>

<canvas id="meter" width="300" height="50" style="border:1px solid #333;"></canvas>

<div id="log"></div>

<script>

// ===== ログ =====
function log(msg){
    console.log(msg);
    document.getElementById("log").innerHTML += msg + "<br>";
}

// ===== マイクメーター =====
function startMicMonitor(stream){
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();
    const mic = audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);

    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("meter");
    const ctx = canvas.getContext("2d");

    function draw(){
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        let volume = dataArray.reduce((a,b)=>a+b) / dataArray.length;

        ctx.clearRect(0,0,300,50);
        ctx.fillStyle = volume > 50 ? "red" : "lime";
        ctx.fillRect(0,0,volume*2,50);
    }
    draw();
}

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let connectedPeers = {};
let talkLocked = false;
let initialized = false;

let audioElement;

// ===== 初期化 =====
async function init(){

    if(initialized) return;
    initialized = true;

    log("初期化開始");

    // マイク
    try{
        localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
        localStream.getAudioTracks()[0].enabled = false;

        startMicMonitor(localStream);

        log("マイクOK");
    }catch(e){
        log("マイクNG: " + e.message);
    }

    // audio作成
    audioElement = new Audio();
    audioElement.setAttribute("playsinline", true);
    audioElement.muted = false;

    // Peer
    peer = new Peer({
        config: {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        }
    });

    peer.on("open", id => {
        log("PeerID: " + id);

        socket.send(JSON.stringify({
            type:"join",
            id
        }));
    });

    // 着信
    peer.on("call", call => {

        call.answer(localStream);

        call.on("stream", stream => {
            log("音声受信");
            audioElement.srcObject = stream;
        });
    });
}

// ===== WebSocket =====
socket.onopen = () => log("WS接続OK");

socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    log("WS: " + data.type);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;
    }

    if(data.type === "userList"){

        data.users.forEach(id => {

            if(peer && id !== peer.id && !connectedPeers[id]){

                log("接続: " + id);

                let call = peer.call(id, localStream);

                call.on("stream", stream => {
                    log("音声受信（発信側）");
                    audioElement.srcObject = stream;
                });

                connectedPeers[id] = true;
            }
        });
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker ? currentSpeaker : "なし";
    }

    if(data.type === "busy"){
        log("他の人が話しています");
    }
};

// ===== 発言制御 =====
setInterval(() => {
    if(localStream){
        localStream.getAudioTracks()[0].enabled =
            (currentSpeaker === myId || talkLocked);
    }
}, 100);

// ===== ボタン =====
let talk = document.getElementById("talk");
let lockBtn = document.getElementById("lockTalk");

// ===== 話す =====
async function handleTalkStart(e){
    e.preventDefault();

    if(!initialized){
        await init();
    }

    // 再生許可（awaitしないのがポイント）
    audioElement.play().catch(()=>{});

    socket.send(JSON.stringify({ type:"requestTalk" }));
}

function handleTalkEnd(e){
    e.preventDefault();

    socket.send(JSON.stringify({
        type:"stopTalk",
        id: myId
    }));
}

// ★ pointerで統一（最重要）
talk.addEventListener("pointerdown", handleTalkStart);
talk.addEventListener("pointerup", handleTalkEnd);

// ===== 固定送信 =====
lockBtn.addEventListener("click", async () => {

    if(!initialized){
        await init();
    }

    audioElement.play().catch(()=>{});

    talkLocked = !talkLocked;

    if(talkLocked){

        lockBtn.textContent = "🔓 固定ON";
        lockBtn.style.background = "red";

        socket.send(JSON.stringify({ type:"requestTalk" }));

        log("固定送信ON");

    }else{

        lockBtn.textContent = "🔒 固定OFF";
        lockBtn.style.background = "";

        socket.send(JSON.stringify({
            type:"stopTalk",
            id: myId
        }));

        log("固定送信OFF");
    }
});

</script>

</body>
</html>
