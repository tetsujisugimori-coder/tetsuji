<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { user-select:none; -webkit-user-select:none; }
button {
  font-size:20px;
  padding:20px;
  margin-right:10px;
  touch-action:manipulation;
}
#log {
  background:#000;
  color:#0f0;
  font-size:12px;
  height:200px;
  overflow:auto;
}
</style>
</head>

<body>

<body>

<script>
console.log("JSスタート");
</script>

<h2>インカム（本番版）</h2>

<h3>接続デバイス</h3>
<ul id="userList"></ul>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>
<button id="lockTalk">🔒 固定OFF</button>

<p>
  🔊 音量:
  <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.3">
  <span id="volumeValue">0.3</span>
</p>

<p>
    <button id = "changeName">名前変更（任意）</button>
</p>

<canvas id="meter" width="300" height="50" style="border:1px solid #333;"></canvas>

<div id="log"></div>

<script>
    

// ===== ログ =====
function log(msg){
    console.log(msg);
    document.getElementById("log").innerHTML += msg + "<br>";
}

// ===== マイクメーター =====
function startMicMonitor(stream){
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();
    const mic = audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);

    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("meter");
    const ctx = canvas.getContext("2d");

    function draw(){
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        let volume = dataArray.reduce((a,b)=>a+b) / dataArray.length;

        ctx.clearRect(0,0,300,50);
        ctx.fillStyle = volume > 50 ? "red" : "lime";
        ctx.fillRect(0,0,volume*2,50);
    }
    draw();
}

window.onerror = function(msg, url, line) {
    alert("エラー: " + msg + " 行:" + line);
};

console.log("JSスタート");

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let connectedPeers = {};
let peerReady = false;
let initialized = false;
let latestUserList = [];
let audioMap = {}; // ★ 複数音声管理
let masterVolume = 0.3;

let talkLocked = false;

let myName = "";
let audioContext;

// ===== 初期化 =====
async function init(){

    if(initialized) return;
    initialized = true;

    log("初期化開始");

    try{
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: false, //マイク感度を下げる

                googEchoCancellation: true,
                googNoiseSuppression: true,
                googHighpassFilter: true,

                sampleRate: 48000,
                channelCount: 1 //モノラル限定に
            }
        });

        // ★ 初期はOFF（話者のみON）
        localStream.getAudioTracks()[0].enabled = false;

        updateMicState(); //追加

        startMicMonitor(localStream);

        log("マイクOK");
    }catch(e){
        log("マイクNG: " + e.message);
    }
}

// ===== Peer作成 =====
function createPeer(){

    peer = new Peer(myId,{ host:"0,peerjs.com",port:443,secure:true});

    peer.on("open", peerId => {
        log("PeerID: " + peerId);
        peerReady = true;

        setTimeout(()=>{
            connectUsers(latestUserList);
        }, 1000);
    });

    peer.on("error", err => log("Peerエラー: " + err));
    
    peer.on("call", call => {
        log("着信: " + call.peer);

        call.answer(localStream);
        attachCallEvents(call);
    });
}

// ===== Call処理 =====
function attachCallEvents(call){

    call.on("stream", stream => {

        // ★ 自分の音は再生しない
        if(call.peer === myId){
            log("自分の音スキップ");
            return;
        }
        

        log("音声受信: " + call.peer);

        let audio = new Audio();
        audio.srcObject = stream;
        audio.autoplay = true;
        audio.volume = masterVolume;
        audio.setAttribute("playsinline", true);

        audio.play().catch(err => {
            log("再生ブロック: " + err);


        });
         
        audioMap[call.peer] = audio;

        updateAudioState(); 
    });

    call.on("close", ()=>{
        log("通話終了: " + call.peer);

        if(audioMap[call.peer]){
            audioMap[call.peer].pause(); //追加[]
            audioMap[call.peer].srcObject = null; //追加
            delete audioMap[call.peer];
        }
    });

    call.on("error", err => log("通話エラー: " + err));
}

// ===== 接続 =====
function connectUsers(users){

    if(!peerReady) return;

    users.forEach(id => {

        const id = user.id;

        if(id !== myId && !connectedPeers[id]){

            log("発信開始: " + id);

            let call = peer.call(id, localStream);

            attachCallEvents(call);

            connectedPeers[id] = true;
        }
    });
}

//ユーザーリストの表示処理
function updateUserList(){
    const ul = document.getElementById("userList");
    ul.innerHTML = "";

    latestUserList.forEach(user =>{
        const li = document.createElement("li");
        li.textContent = (user.id === myId ? "👉 " : "") + (user.name || user.id);
        ul.appendChild(li);
    });
}

//名前送信
function sendName(){
    socket.send(JSON.stringify({
     type: "setName",
     id: myId,
     name: myName   
    }));
}

//話者変更・新規接続時の制御用定義
function updateAudioState(){
    Object.keys(audioMap).forEach(id =>{
        const audio = audioMap[id];
        if(!audio) return;
        //ミュート制御
            audio.muted = (id !== currentSpeaker);

        //音量制御
            audio.volume =(id === currentSpeaker || !currentSpeaker) 
            ? masterVolume 
            : 0;
        });
}

document.getElementById("changeName").addEventListener("click",()=>{
    const newName = prompt("名前を入力してください");

    if(newName){
        myName = newName;
        sendName();
    }
});

// ===== 再接続 =====
setInterval(()=>{
    if(peerReady && latestUserList.length){
        connectUsers(latestUserList);
    }
}, 3000);

// ===== WebSocket =====
socket.onopen = () => log("WS接続OK");

socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    log("WS: " + data.type);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;

        //自動名前生成
     if(!myName || myName === ""){
       myName = generateName();
     }
              sendName();
              createPeer();
    }

    if(data.type === "userList"){
        latestUserList = data.users;  //→｛id,name}

        updateUserList(); //追加
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker ? currentSpeaker : "なし";

        updateAudioState(); //追加　
        updateMicState(); //追加
    }

    if(data.type === "busy"){
        log("他の人が話しています");
    }
};

// ON　OFF制御をイベント駆動にする
function updateMicState(){
    if(localStream){
        localStream.getAudioTracks()[0].enabled = 
        (currentSpeaker === myId || talkLocked);

        
    }
}

//デバイス判定関数
function getDeviceType(){
    const ua = navigator.userAgent;
    
    //iphone
    if(/iphone/i.test(ua)) return "iphone";

    //Android
    if(
        /ipad/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      ){
        return "ipad";
      }
      return "PC";
}

//自動名前生成
function generateName(){
    const type = getDeviceType();

    return type + " " + myId.slice(0,4);
}

// ===== ボタン =====
let talk = document.getElementById("talk");

talk.addEventListener("click", async (e)=>{
    e.preventDefault();

    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();

    } 
    await audioContext.resume();

    if(!initialized) await init();

    socket.send(JSON.stringify({ type:"requestTalk" }));
});

talk.addEventListener("mouseup", (e)=>{
    e.preventDefault();

    socket.send(JSON.stringify({
        type:"stopTalk",
        id: myId
    }));
});

// ===== 音量スライダー =====
const slider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");

slider.addEventListener("input", () => {
    masterVolume = parseFloat(slider.value);
    volumeValue.textContent = masterVolume.toFixed(2);

    updateAudioState();
});

// ===== 固定ボタン =====
let lockBtn = document.getElementById("lockTalk");

lockBtn.addEventListener("click", async ()=>{

    if(!initialized) await init();

    talkLocked = !talkLocked;

    if(talkLocked){
        lockBtn.textContent = "🔓 固定ON";
        socket.send(JSON.stringify({ type:"requestTalk" }));
    }else{
        lockBtn.textContent = "🔒 固定OFF";
        socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
    }
    updateMicState(); //追加
});



</script>

</body>
</html>
