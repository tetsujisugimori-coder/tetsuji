<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { user-select:none; -webkit-user-select:none; }
button {
  font-size:20px;
  padding:20px;
  margin-right:10px;
  touch-action:manipulation;
}

button.active {
    background: orange;
    transform: scale(1.1);
}

#log {
  background:#000;
  color:#0f0;
  font-size:12px;
  height:200px;
  overflow:auto;
}


</style>
</head>

<body>

<script>
console.log("JSスタート");
</script>

<h2>インカム（本番版）</h2>

<h3>接続デバイス</h3>
<ul id="userList"></ul>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>
<button id="lockTalk">🔒 固定OFF</button>

<p>
  🔊 音量:
  <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.3">
  <span id="volumeValue">0.3</span>
</p>

<p>
    <button id = "changeName">名前変更（任意）</button>
</p>

<canvas id="meter" width="300" height="50" style="border:1px solid #333;"></canvas>

<div id="log"></div>

<script>
    

// ===== ログ =====
function log(msg){
    console.log(msg);
    document.getElementById("log").innerHTML += msg + "<br>";
}

// ===== マイクメーター =====
function startMicMonitor(stream){
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();
    const mic = audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);

    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("meter");
    const ctx = canvas.getContext("2d");

    function draw(){
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        let volume = dataArray.reduce((a,b)=>a+b) / dataArray.length;

        ctx.clearRect(0,0,300,50);
        ctx.fillStyle = volume > 50 ? "red" : "lime";
        ctx.fillRect(0,0,volume*2,50);
    }
    draw();
}

window.onerror = function(msg, url, line) {
    alert("エラー: " + msg + " 行:" + line);
};

console.log("JSスタート");

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let currentMode = null //manual or Lock
let connectedPeers = {};
let peerReady = false;
let initialized = false;
let latestUserList = [];
let audioMap = {}; // ★ 複数音声管理
let masterVolume = 0.3;

let talkLocked = false;

let myName = "";
let audioContext;

async function unlockAll(){

    if(initialized) return;

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();

    try{
        localStream = await navigator.mediaDevices.getUserMedia({ audio:true });

        localStream.getAudioTracks()[0].enabled = false;

        startMicMonitor(localStream);

        initialized = true;

        log("マイクOK");
    }catch(e){
        log("マイクNG: " + e.message);
    }
}

// ===== 初期化 =====
async function init(){

    if(initialized) return;
    initialized = true;

    log("初期化開始");

    try{
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: false, //マイク感度を下げる

                googEchoCancellation: true,
                googNoiseSuppression: true,
                googHighpassFilter: true,

                sampleRate: 48000,
                channelCount: 1 //モノラル限定に
            }
        });

        // ★ 初期はOFF（話者のみON）
        localStream.getAudioTracks()[0].enabled = false;

        updateMicState(); //追加

        startMicMonitor(localStream);

        log("マイクOK");
    }catch(e){
        log("マイクNG: " + e.message);
    }
}

// ===== Peer作成 =====
function createPeer(){

    peer = new Peer(myId,{ 
        host:"0.peerjs.com",
        port:443,
        secure:true
    });

    peer.on("open", peerId => {
        log("PeerID: " + peerId);
        peerReady = true;

        setTimeout(()=>{
            connectUsers(latestUserList);
        }, 1000);
    });

    peer.on("error", err => log("Peerエラー: " + err));
    
    peer.on("call", call => {
        log("着信: " + call.peer);

        call.answer(localStream);
        attachCallEvents(call);
    });
}

// ===== Call処理 =====
function attachCallEvents(call){

    call.on("stream", stream => {
        if(!call){
            log("call undefined");
            return;
        }

        // ★ 自分の音は再生しない
        if(call.peer === myId){
            log("自分の音スキップ");
            return;
        }
        

        log("音声受信: " + call.peer);

        let audio = new Audio();
        audio.srcObject = stream;
        audio.autoplay = true;
        audio.volume = masterVolume;
        audio.setAttribute("playsinline", true);

        audio.play().catch(err => {
            log("再生ブロック: " + err);


        });
         
        audioMap[call.peer] = audio;

        updateAudioState(); 
    });

    call.on("close", ()=>{
        log("通話終了: " + call.peer);

        if(audioMap[call.peer]){
            audioMap[call.peer].pause(); //追加[]
            audioMap[call.peer].srcObject = null; //追加
            delete audioMap[call.peer];
        }
    });

    call.on("error", err => log("通話エラー: " + err));
}

// ===== 接続 =====
function connectUsers(users){

    if(!peerReady) return;
    if(!localStream) return;

    users.forEach(user => {
        const userId = user.id;

        if(userId !== myId && !connectedPeers[userId]){

            log("発信開始: " + userId);

            try{
                let call = peer.call(userId, localStream);

                if(!call){
                    log("call失敗: " + userId);
                    return;
                }

                attachCallEvents(call);
                connectedPeers[userId] = true;

            }catch(e){
                log("call例外: " + e.message);
            }
        }
    });
}

//ユーザーリストの表示処理
function updateUserList(){
    const ul = document.getElementById("userList");
    ul.innerHTML = "";

    latestUserList.forEach(user =>{
        const li = document.createElement("li");
        li.textContent = (user.id === myId ? "👉 " : "") + (user.name || user.id);
        ul.appendChild(li);
    });
    if(currentSpeaker){
        const user = latestUserList.find(u => u.id === currentSpeaker);
        const name = user ? (user.name || user.id) : currentSpeaker;

        document.getElementById("speaker").textContent = name;
    }
}

//名前送信
function sendName(){
    socket.send(JSON.stringify({
     type: "setName",
     id: myId,
     name: myName   
    }));
}

//話者変更・新規接続時の制御用定義
function updateAudioState(){
    Object.keys(audioMap).forEach(id =>{
        const audio = audioMap[id];
        if(!audio) return;
        //ミュート制御
            audio.muted = (id !== currentSpeaker);

        //音量制御
            audio.volume =(id === currentSpeaker || !currentSpeaker) 
            ? masterVolume 
            : 0;
        });
}

document.getElementById("changeName").addEventListener("click",()=>{
    const newName = prompt("名前を入力してください");

    if(newName){
        myName = newName;
        sendName();

        //自分表示を更新
        document.getElementById("myId").textContent =
        myName + "(" + myId + ")";

        //話者表示も更新
        if(currentSpeaker === myId){
            document.getElementById("speaker").textContent =
            myName;
        }
    }
});

// ===== 再接続 =====
setInterval(()=>{
    if(peerReady && latestUserList.length){
        connectUsers(latestUserList);
    }
}, 3000);

// ===== WebSocket =====
socket.onopen = () => log("WS接続OK");

socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    log("WS: " + data.type);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;

        //自動名前生成
     if(!myName || myName === ""){
       myName = generateName();
     }
              sendName();
              createPeer();
    }

    if(data.type === "userList"){
        latestUserList = data.users;  //→｛id,name}

        updateUserList(); //追加
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        let speakerName = "なし";

        if(currentSpeaker === myId){
            speakerName = myName || myId;
        }else{
            const user = latestUserList.find(u => u.id === currentSpeaker);
            speakerName = user ? (user.name || user.id) : currentSpeaker;
            
        }

        document.getElementById("speaker").textContent = speakerName;
           
        updateAudioState(); //追加　
        updateMicState(); //追加
    }

    if(data.type === "busy"){
        log("他の人が話しています");

        playSound("error.mp3");
    }
};

// ON　OFF制御をイベント駆動にする
function updateMicState(){
    if(localStream){
        localStream.getAudioTracks()[0].enabled = 
        (currentSpeaker === myId || talkLocked);

        
    }
}

//デバイス判定関数
function getDeviceType(){
    const ua = navigator.userAgent;
    
    //iphone
    if(/iphone/i.test(ua)) return "iphone";

    //Android
    if(
        /ipad/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      ){
        return "ipad";
      }
      return "PC";
}

//自動名前生成
function generateName(){
    const type = getDeviceType();

    return type + " " + myId.slice(0,4);
}

// ===== ボタン =====
let talk = document.getElementById("talk");

talk.addEventListener("mousedown", async (e)=>{
    e.preventDefault();

    await unlockAll();  //ここで全て初期化

    playSound("start.mp3")

    socket.send(JSON.stringify({ 
        type:"requestTalk",
        mode:"manual"
     }));

     //エフェクト
     talk.classList.add("active");
});

talk.addEventListener("mouseup", (e)=>{
    e.preventDefault();

    socket.send(JSON.stringify({
        type:"stopTalk",
        id: myId
    }));

    talk.classList.remove("active");
});

//iphone対応
talk.addEventListener("touchstart", talkDown);
talk.addEventListener("touchend",talkUp);


async function talkDown(e){
    e.preventDefault();

    await unlockAll();

    playSound("start.mp3");

    socket.send(JSON.stringify({
        type:"requestTalk",
        mode:"manual"
    }));

    talk.classList.add("active");
}

async function talkUp(e){
    e.preventDefault();

    await unlockAll(); // 追加（安全）

    playSound("stop.mp3");

    socket.send(JSON.stringify({
        type:"stopTalk",
        id: myId
    }));

    talk.classList.remove("active");
}

// ===== 音量スライダー =====
const slider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");

slider.addEventListener("input", () => {
    masterVolume = parseFloat(slider.value);
    volumeValue.textContent = masterVolume.toFixed(2);

    updateAudioState();
});

// ===== 固定ボタン =====
let lockBtn = document.getElementById("lockTalk");

let lockTimer = null;

lockBtn.addEventListener("click", async ()=>{

    await unlockAll();

    playSound("lock.mp3");

    

    socket.send(JSON.stringify({
        type:"requestTalk",
        mode:"lock"
    }));

    let remaining = 10;

    clearInterval(lockTimer);

    lockTimer = setInterval(()=>{

        remaining--;

        lockBtn.textContent = `🔓 固定ON (${remaining})`;

        if(remaining <= 0){
            clearInterval(lockTimer);

            socket.send(JSON.stringify({
                type:"stopTalk",
                id: myId
            }));

            lockBtn.textContent = "🔒 固定OFF";
        }

        // ★ ここ追加（重要）
        updateMicState();

    },1000);

    // ★ ここも追加（重要）
    updateMicState();
});


let audioUnlocked = false;

function unlockAudio(){

    if(audioUnlocked) return;

    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
      audioContext.resume().then(()=>{
        console.log("AudioContext 解放OK");
        audioUnlocked = true;
    }).catch(err=>{
        console.log("解放失敗:", err);
    });

}

function playSound(file){

    if(!audioContext) return;

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    const audio = new Audio("sounds/" + file);
    audio.currentTime = 0;
    audio.volume = 0.5;

    audio.play().catch(err=>{
        console.log("音再生エラー:", err);
    });
}

document.addEventListener("touchstart", unlockAudio, { once:true });
document.addEventListener("click", unlockAudio, { once:true });



</script>

</body>
</html>
