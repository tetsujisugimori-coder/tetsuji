<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { user-select:none; }
button { font-size:20px; padding:20px; margin-right:10px; }
#log { background:#000; color:#0f0; font-size:12px; height:200px; overflow:auto; }
</style>
</head>

<body>

<h2>インカム（安定版）</h2>

<p>自分: <span id="myId"></span></p>
<p>話者: <span id="speaker">なし</span></p>

<button id="talk">🎤 話す</button>
<button id="lockTalk">🔒 固定OFF</button>

<canvas id="meter" width="300" height="50"></canvas>
<div id="log"></div>

<script>

// ===== ログ =====
function log(msg){
    console.log(msg);
    document.getElementById("log").innerHTML += msg + "<br>";
}

// ===== マイク制御（改善①）=====
function setMicEnabled(enabled){
    if(localStream){
        localStream.getAudioTracks().forEach(track=>{
            track.enabled = enabled;
        });
    }
}

// ===== 他人音ミュート（改善③）=====
function updateAudioMute(){
    Object.keys(audioMap).forEach(id=>{
        audioMap[id].muted = (currentSpeaker === myId);
    });
}

// ===== 状態 =====
let socket = new WebSocket("wss://peerjs-server-etm4.onrender.com");
let peer;
let localStream;
let myId = null;
let currentSpeaker = null;
let connectedPeers = {};
let audioMap = {};
let talkLocked = false;
let latestUserList = [];
let peerReady = false;
let initialized = false;

// ===== 初期化 =====
async function init(){

    if(initialized) return;
    initialized = true;

    localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1 // ★改善④
        }
    });

    setMicEnabled(false);
}

// ===== Peer =====
function createPeer(){

    peer = new Peer(myId);

    peer.on("open", () => {
        peerReady = true;
        setTimeout(()=>connectUsers(latestUserList), 1000);
    });

    peer.on("call", call => {
        call.answer(localStream);
        attachCallEvents(call);
    });
}

// ===== 通話 =====
function attachCallEvents(call){

    call.on("stream", stream => {

        if(call.peer === myId) return;

        let audio = new Audio();
        audio.srcObject = stream;
        audio.autoplay = true;
        audio.setAttribute("playsinline", true);

        audio.volume = 0.5; // ★改善②

        audio.play().catch(()=>{});

        audioMap[call.peer] = audio;
    });

    call.on("close", ()=>{
        if(audioMap[call.peer]){
            audioMap[call.peer].remove();
            delete audioMap[call.peer];
        }
    });
}

// ===== 接続 =====
function connectUsers(users){

    if(!peerReady) return;

    users.forEach(id => {

        if(id !== myId && !connectedPeers[id]){

            let call = peer.call(id, localStream);
            attachCallEvents(call);
            connectedPeers[id] = true;
        }
    });
}

// ===== 再接続 =====
setInterval(()=>{
    if(peerReady) connectUsers(latestUserList);
},3000);

// ===== WebSocket =====
socket.onmessage = msg => {

    let data = JSON.parse(msg.data);

    if(data.type === "yourId"){
        myId = data.id;
        document.getElementById("myId").textContent = myId;
        createPeer();
    }

    if(data.type === "userList"){
        latestUserList = data.users;
    }

    if(data.type === "speaker"){
        currentSpeaker = data.id;

        document.getElementById("speaker").textContent =
            currentSpeaker ? currentSpeaker : "なし";

        updateAudioMute(); // ★改善③
    }
    if(data.type === "transcript"){
    log(`[${new Date().toLocaleTimeString()}] ${data.id}: ${data.text}`);
}
};

// ===== マイク制御ループ（改善①）=====
setInterval(() => {

    if(currentSpeaker === myId || talkLocked){
        setMicEnabled(true);
    }else{
        setMicEnabled(false);
    }

}, 50);

// ===== ボタン =====
document.getElementById("talk").onpointerdown = async ()=>{
    await init();
    socket.send(JSON.stringify({ type:"requestTalk" }));
};

document.getElementById("talk").onpointerup = ()=>{
    socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
};

// ===== 固定 =====
document.getElementById("lockTalk").onclick = async ()=>{

    await init();

    talkLocked = !talkLocked;

    if(talkLocked){
        socket.send(JSON.stringify({ type:"requestTalk" }));
    }else{
        socket.send(JSON.stringify({ type:"stopTalk", id: myId }));
    }
};

</script>
</body>
</html>
<script>

// ===== 音声認識 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if(SpeechRecognition){
    recognition = new SpeechRecognition();
    recognition.lang = "ja-JP";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {

        const text = event.results[event.results.length - 1][0].transcript;

        log("📝 " + text);

        socket.send(JSON.stringify({
            type: "transcript",
            text: text,
            id: myId
        }));
    };

    recognition.onend = () => {
        if(currentSpeaker === myId || talkLocked){
            recognition.start(); // 自動再開
        }
    };
}

// ===== マイク制御に追加 =====
setInterval(() => {

    if(currentSpeaker === myId || talkLocked){
        setMicEnabled(true);
        if(recognition) recognition.start();
    }else{
        setMicEnabled(false);
        if(recognition) recognition.stop();
    }

}, 200);

</script>
